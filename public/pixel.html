<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Pixel Cricketer — Guess the famous cricketer from the scrambled photo. Each guess unblurs the picture." />
  <title>Pixel Cricketer — Cricketle</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=2.4.0" />
  <script src="theme.js?v=2.4.0"></script>
  <style>
    .pixel-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    .game-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .game-header h2 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(32px, 7vw, 48px);
      letter-spacing: 1.5px;
      color: var(--text-primary, #fff);
      margin: 0 0 4px;
    }

    .game-header p {
      font-size: 14px;
      color: var(--text-muted, #94a3b8);
      margin: 0 0 16px;
    }

    /* Mode selector pill */
    .mode-toggle {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 3px;
      gap: 4px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted, #94a3b8);
      padding: 6px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #a855f7;
      color: #fff;
    }

    /* Canvas photo container */
    .photo-card {
      position: relative;
      background: var(--card-bg, rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.25);
    }

    .canvas-wrapper {
      position: relative;
      width: 280px;
      height: 340px;
      max-width: 100%;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      background: #0b1220;
    }

    #pixel-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s ease;
    }

    /* Attempt indicators */
    .attempts-track {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 16px 0 0;
    }

    .attempt-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }

    .attempt-dot.used-wrong {
      background: #ef4444;
      border-color: #ef4444;
    }

    .attempt-dot.used-correct {
      background: #22c55e;
      border-color: #22c55e;
    }

    .attempt-dot.current {
      background: #a855f7;
      border-color: #a855f7;
      transform: scale(1.2);
    }

    /* Input & Autocomplete */
    .guess-box {
      position: relative;
      margin-bottom: 16px;
    }

    .guess-input-wrap {
      display: flex;
      gap: 8px;
    }

    .guess-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .guess-input:focus {
      border-color: #a855f7;
    }

    .btn-guess {
      background: #a855f7;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-guess:hover {
      opacity: 0.9;
    }

    .btn-skip {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted, #94a3b8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-skip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Autocomplete dropdown */
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #0f172a;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      margin-top: 4px;
      display: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .autocomplete-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
    }

    .autocomplete-item:hover, .autocomplete-item.active {
      background: rgba(168, 85, 247, 0.2);
      color: #fff;
    }

    .autocomplete-country {
      color: #94a3b8;
      font-size: 12px;
    }

    /* Guess history log */
    .guess-history {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .guess-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid #ef4444;
      font-size: 14px;
    }

    .guess-item.correct {
      border-left-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }

    .guess-item.skipped {
      border-left-color: #64748b;
      color: #94a3b8;
    }

    /* Result modal card */
    .result-card {
      background: var(--card-bg, rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      display: none;
      animation: hubFadeIn 0.4s ease-out;
      margin-top: 16px;
    }

    .result-card.won {
      border-color: rgba(34, 197, 94, 0.6);
    }

    .result-card.lost {
      border-color: rgba(239, 68, 68, 0.6);
    }

    .result-title {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 32px;
      letter-spacing: 1px;
      margin: 0 0 6px;
    }

    .result-name {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 4px;
    }

    .result-hint {
      font-size: 13.5px;
      color: var(--text-muted, #94a3b8);
      margin: 0 0 16px;
      line-height: 1.4;
    }

    .back-hub-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted, #94a3b8);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      transition: color 0.2s;
    }

    .back-hub-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to game</a>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand">
      <a href="hub.html" class="brand-mark" aria-label="Back to Hub" style="text-decoration:none;"><span style="font-size:20px;">📸</span></a>
      <div class="brand-text">
        <h1>Pixel Cricketer</h1>
        <p class="tagline">Guess the cricketer from the scrambled photo</p>
      </div>
    </div>
    <nav class="nav" aria-label="Primary">
      <a href="hub.html" class="nav-link"><span>← All Games</span></a>
    </nav>
  </header>

  <main id="main" class="pixel-container">
    <a href="hub.html" class="back-hub-btn">← Back to Game Hub</a>

    <div class="game-header">
      <h2>GUESS THE CRICKETER</h2>
      <p>The photo unscrambles slightly with every attempt. You have 6 tries!</p>
      <div class="mode-toggle">
        <button id="mode-easy" class="mode-btn active" data-mode="easy">Current Active (Top 50)</button>
        <button id="mode-hard" class="mode-btn" data-mode="hard">All-Time Legends</button>
      </div>
    </div>

    <!-- Photo Card -->
    <div class="photo-card">
      <div class="canvas-wrapper">
        <canvas id="pixel-canvas" width="280" height="340"></canvas>
      </div>
      <div class="attempts-track" id="attempts-track">
        <span class="attempt-dot current"></span>
        <span class="attempt-dot"></span>
        <span class="attempt-dot"></span>
        <span class="attempt-dot"></span>
        <span class="attempt-dot"></span>
        <span class="attempt-dot"></span>
      </div>
    </div>

    <!-- Guess Input -->
    <div class="guess-box" id="guess-controls">
      <div class="guess-input-wrap">
        <input type="text" id="guess-input" class="guess-input" placeholder="Type player name..." autocomplete="off" />
        <button id="btn-skip" class="btn-skip" title="Skip to unblur more">Skip</button>
        <button id="btn-guess" class="btn-guess">Guess</button>
      </div>
      <div id="autocomplete-list" class="autocomplete-list"></div>
    </div>

    <!-- Guess History -->
    <div class="guess-history" id="guess-history"></div>

    <!-- Result Card -->
    <div class="result-card" id="result-card">
      <h3 class="result-title" id="result-status">OUT!</h3>
      <p class="result-name" id="result-name"></p>
      <p class="result-hint" id="result-hint"></p>
      <a href="hub.html" class="tile-play-btn" style="text-decoration:none;display:inline-flex;">Play Other Games →</a>
    </div>
  </main>

  <script src="bg.js"></script>
  <script src="players.js"></script>
  <script src="pixel.js"></script>
</body>
</html>
